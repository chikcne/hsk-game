# Battle Mode tuning parameters. Parsed and strictly validated exactly once at
# server startup (src/server/config.ts); the validated object is also served
# to the client as `battleConfig` on GET /api/saves/default.
#
# Every learning-slot, category-boundary, mastery-delta, and draw-curve number
# lives here — never hardcoded in server or domain logic. The mastery scale
# itself is fixed at 0..100 by the vocab schema.

# Learning slots: the pool always holds exactly this many lowest-id words at
# mastery <= boundaries.lowMax (plus every word above lowMax). When an outcome
# graduates a slot word past lowMax, the next unseen curriculum entry is
# appended in strict curriculum order until the slot count is restored.
learningSlots: 5

# Mastery category boundaries. low: 0..lowMax, developing: lowMax+1..developingMax,
# mastered: developingMax+1..100.
boundaries:
  lowMax: 50
  developingMax: 99

# Cost of a wrong answer, at any point in an encounter and in second chance
# too: a wrong pinyin or a wrong meaning subtracts masteryDelta, clamped to
# 0..100. A word that simply reaches the ground unanswered costs nothing.
masteryDelta: 10

# Answer-speed mastery curve. A dedicated answer timer starts the moment a word
# becomes the locked target and runs until the meaning answer resolves it, so it
# spans BOTH the pinyin and the meaning phase. Gain is piecewise linear through
# three anchors: flat at maxGain up to maxMs, sloping down to midGain at midMs,
# then down to floorGain at floorMs.
#
# Reaching floorMs without resolving opens SECOND CHANCE instead: gameplay
# freezes, the answer has no time limit, and answering correctly there applies
# secondChanceGain rather than any curve value.
masteryCurve:
  maxMs: 1500
  maxGain: 50
  midMs: 5000
  midGain: 20
  floorMs: 8000
  floorGain: 1
  secondChanceGain: 0

# Altitude relief granted to every OTHER word on the field when one word is
# answered correctly, as a fraction of the full descent. A second-chance answer
# grants the smaller amount; a wrong answer grants none.
relief:
  correct: 0.10
  secondChance: 0.05

# Hill curve r(n) = n^shape / (n^shape + midpoint^shape), where n counts words
# with mastery above lowMax. r interpolates the low-category draw share from 1
# down to its asymptote as the developed vocabulary grows.
curve:
  midpoint: 5
  shape: 1.3

# Asymptotic category shares as n -> infinity (must sum to 1). lowShare(n) =
# 1 - r(n) * (1 - asymptotes.low); the developed remainder r(n) splits between
# developing and mastered proportionally to their asymptotes, renormalized
# when a category is empty.
asymptotes:
  low: 0.10
  developing: 0.50
  mastered: 0.40
